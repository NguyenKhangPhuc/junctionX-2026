[project]
name = "junction-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NguyenKhangPhuc", email = "nkpnkpnkp2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "av<19",
    "coqui-tts[codec]>=0.28.0",
    "edge-tts>=7.3.1",
    "fastapi>=0.147.0",
    "fastembed>=0.9.0",
    "faster-whisper>=1.2.1",
    "greenlet>=3.5.6",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["data", ".venv"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]


